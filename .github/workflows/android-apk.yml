name: Android APK

# Build do APK sem EAS: prebuild + Gradle dentro do runner do GitHub.
on:
  push:
    branches:
      - arena/778ec580-habit-tracker
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write # publicar o APK no release "android-latest"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # O runner ubuntu-latest já vem com Android SDK + build-tools; a action
      # android-actions/setup-android falhou no primeiro run, então só conferimos.
      - name: Conferir Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -3
          ls "$ANDROID_HOME/build-tools" | tail -3

      # Gradle e cache de build ficam fora do projeto para não sujar o diff do .gitignore.
      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependências
        # O projeto usa --legacy-peer-deps (Expo 54 + Reanimated 4 + widget).
        run: npm ci --legacy-peer-deps

      - name: Checagem rápida (tipos + testes)
        # Antes rodava só tipos + lógica + store: uma tela quebrada chegava
        # intacta até o APK. Render e telas entram aqui — é o build que o
        # usuário instala, não o `npm test` local.
        run: |
          npx tsc --noEmit
          npm run test:logic
          npm run test:store
          npm run test:render
          npm run test:screens

      - name: Gerar projeto Android (prebuild)
        # Widget nativo e plugin do expo config só existem depois do prebuild.
        run: npx expo prebuild --platform android --no-install

      - name: Conferir versão que vai para o APK
        # O APK já saiu sem versionCode crescente uma vez: duas builds
        # diferentes pareciam o mesmo app. Aqui a config é lida DEPOIS do
        # prebuild, no arquivo que o Gradle realmente usa.
        run: |
          node -e "
            const cfg = require('./app.json').expo;
            const gradle = require('fs').readFileSync('android/app/build.gradle', 'utf8');
            const vn = /versionName\s+[\"']([^\"']+)[\"']/.exec(gradle)?.[1];
            const vc = /versionCode\s+(\d+)/.exec(gradle)?.[1];
            console.log('config:', cfg.version, '/', cfg.android.versionCode, '| gradle:', vn, '/', vc);
            if (!vn || !vc) throw new Error('versionName/versionCode não encontrados no build.gradle');
            if (vn !== cfg.version) throw new Error('versionName do gradle (' + vn + ') != app.json (' + cfg.version + ')');
            if (String(vc) !== String(cfg.android.versionCode)) throw new Error('versionCode do gradle (' + vc + ') != app.json (' + cfg.android.versionCode + ')');
            console.log('OK: o APK sai com ' + vn + ' (build ' + vc + ')');
          "

      - name: Build do APK (release)
        working-directory: android
        env:
          # Log do Gradle em arquivo: vira anotação (::error::) e artefato quando falha,
          # para não depender do visualizador de log do Actions.
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
        id: gradle
        # Sem `pipefail` o código de saída do Gradle era o do `tail` (0) e o build
        # "passava" sem APK. O status agora vem de PIPESTATUS, gravado no arquivo.
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PreactNativeArchitectures=arm64-v8a 2>&1 | tee ../gradle-build.log | tail -n 40
          echo "GRADLE_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0

      - name: Extrair a causa da falha
        if: env.GRADLE_EXIT != '0'
        run: |
          {
            echo "exit=$GRADLE_EXIT"
            grep -nE "What went wrong" -A 12 gradle-build.log | head -n 40
            echo '---'
            grep -nE "e: file|error:" gradle-build.log | head -n 20
          } > gradle-reason.txt
          # Uma linha só: aparece legível na anotação do commit.
          tr '\n' ' ' < gradle-reason.txt | cut -c1-900 | sed 's/^/::error title=Gradle::/'

      # Artefato ANTES do passo que falha (se falhar primeiro, nada é publicado).
      - name: Log do Gradle (quando falha)
        if: env.GRADLE_EXIT != '0'
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            gradle-build.log
            gradle-reason.txt
          retention-days: 14

      - name: Falhar com o motivo
        if: env.GRADLE_EXIT != '0'
        run: |
          echo "### Falha no Gradle (exit $GRADLE_EXIT)" >> "$GITHUB_STEP_SUMMARY"
          cat gradle-reason.txt >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Renomear APK
        # O nome carrega versão + commit curto: baixar `my-prime-v1.1.0-06eb034.apk`
        # diz exatamente o que é, coisa que `my-prime-latest.apk` não faz.
        run: |
          mkdir -p artifacts
          VERSION="$(node -e "console.log(require('./app.json').expo.version)")"
          SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          NAME="my-prime-v${VERSION}-${SHA}"
          echo "APK_VERSION=${VERSION}" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/${NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/my-prime-latest.apk
          echo "APK_NAME=${NAME}" >> "$GITHUB_ENV"
          ls -lh artifacts

      # Prova que o APK é instalável e contém o que deveria (não só que o Gradle disse "ok").
      - name: Verificar conteúdo do APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          python3 - <<'EOF'
          import zipfile
          apk = 'android/app/build/outputs/apk/release/app-release.apk'
          z = zipfile.ZipFile(apk)
          names = z.namelist()
          print('entradas:', len(names))
          for need in ['AndroidManifest.xml', 'classes.dex']:
              assert need in names, f'faltando {need}'
          libs = sorted({n.split('/')[1] for n in names if n.startswith('lib/')})
          assert 'arm64-v8a' in libs, f'sem arm64-v8a: {libs}'
          print('libs:', libs)
          dex = [n for n in names if n.endswith('.dex')]
          print('dex:', dex)
          EOF
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump badging "$APK" | grep -E "^package:|application-label:|sdkVersion|targetSdkVersion|native-code" || true
          # Prova final: a versão que está DENTRO do APK tem que ser a da config.
          EXPECTED="$(node -e "const c=require('./app.json').expo;console.log(c.version+' '+c.android.versionCode)")"
          ACTUAL="$("$AAPT" dump badging "$APK" | sed -n "s/^package:.*versionCode='\([0-9]*\)'.*versionName='\([^']*\)'.*/\2 \1/p")"
          echo "esperado: $EXPECTED | no APK: $ACTUAL"
          {
            echo "### Versão do APK"
            echo ""
            echo "- config: \`$EXPECTED\`"
            echo "- dentro do APK (aapt2): \`$ACTUAL\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error title=Versão::o APK saiu com '$ACTUAL' mas a config diz '$EXPECTED'"
            exit 1
          fi
          SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          echo "- sha256: \`$SHA256\`" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256 do APK: $SHA256"

      # Sem isso o link do APK é um endereço de blob do Azure, que expira e não abre
      # para o usuário final. A release com `latest` sempre aponta para o APK atual.
      - name: Link fixo para o último APK
        run: |
          echo "### APK gerado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- [\`my-prime-latest.apk\`](${{ github.server_url }}/${{ github.repository }}/releases/download/android-latest/my-prime-latest.apk)" >> "$GITHUB_STEP_SUMMARY"
          echo "- build #${{ github.run_number }} · commit \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: my-prime-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar no release "android-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: MY PRIME — APK (build automático)
          body: |
            APK assinado com a debug keystore gerada no runner (instalável, não serve para a Play Store).

            - versão: `v${{ env.APK_VERSION }}` (commit \`${{ github.sha }}\`)
            - workflow: #${{ github.run_number }}
            - gerado em: ${{ github.event.head_commit.timestamp }}

            Link estável (sempre o mais novo): `my-prime-latest.apk`.
            Link identificado (este build exato): `${{ env.APK_NAME }}.apk`.
          # Dois nomes: o fixo para o link de sempre, o identificado para não
          # existir dúvida de qual build é qual (o nome fixo sobrescreve sempre).
          files: |
            artifacts/my-prime-latest.apk
            artifacts/${{ env.APK_NAME }}.apk
          prerelease: true
          make_latest: false
